[package]
name = "ive"
version = "1.0.27"
description = "IVE — local agent-orchestration desktop shell"
authors = ["AIFOREU GmbH"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

# The desktop shell wraps the existing React/Vite build (see ../dist) and lets it talk to the
# local IVE Python backend. Native ops are exposed as #[tauri::command] handlers in src/main.rs.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
tauri-plugin-updater = "=2.14.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[features]
# this feature is used for production builds where `devUrl` points to the bundled assets
custom-protocol = ["tauri/custom-protocol"]
